  <circle cx="64" cy="68" r="22" fill="white" opacity="0.1"/>
  <!-- 眼睛 -->
  <ellipse cx="54" cy="64" rx="6" ry="7" fill="white" opacity="0.9"/>
  <ellipse cx="74" cy="64" rx="6" ry="7" fill="white" opacity="0.9"/>
  <ellipse cx="55" cy="65" rx="3.5" ry="4.5" fill="#1a1a2e"/>
  <ellipse cx="75" cy="65" rx="3.5" ry="4.5" fill="#1a1a2e"/>
  <circle cx="52" cy="61" r="1.5" fill="white"/>
  <circle cx="72" cy="61" r="1.5" fill="white"/>
  <!-- 嘴巴 -->
  <path d="M 60,74 Q 64,78 68,74" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 代码行围巾 -->
  <rect x="36" y="82" width="56" height="4" rx="2" fill="url(#g)" opacity="0.5"/>
  <rect x="40" y="88" width="48" height="3" rx="1.5" fill="white" opacity="0.15"/>
