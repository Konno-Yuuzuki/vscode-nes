<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="#1a1a2e"/>
  <g fill="#1a1a2e">
    <!-- 背景 - 深空 -->
  </g>
  <!-- 像素 chibi 角色 - 每个像素 4x4 -->
  <defs>
    <style>
      .p { shape-rendering: crispEdges; }
    </style>
  </defs>
  <g class="p">
    <!-- 头发 - 蓝色 -->
    <g fill="#409efc">
      <rect x="40" y="24" width="8" height="8"/>
      <rect x="48" y="20" width="8" height="8"/>
      <rect x="56" y="16" width="16" height="8"/>
      <rect x="72" y="20" width="8" height="8"/>
      <rect x="80" y="24" width="8" height="8"/>
      <rect x="36" y="32" width="8" height="8"/>
      <rect x="84" y="32" width="8" height="8"/>
      <rect x="32" y="40" width="8" height="8"/>
      <rect x="88" y="40" width="8" height="8"/>
      <rect x="32" y="48" width="8" height="8"/>
      <rect x="88" y="48" width="8" height="8"/>
      <rect x="28" y="56" width="8" height="8"/>
      <rect x="92" y="56" width="8" height="8"/>
      <rect x="28" y="64" width="8" height="8"/>
      <rect x="92" y="64" width="8" height="8"/>
      <!-- 刘海 -->
      <rect x="48" y="28" width="8" height="8"/>
      <rect x="56" y="28" width="8" height="8"/>
      <rect x="64" y="28" width="8" height="8"/>
      <rect x="72" y="28" width="8" height="8"/>
    </g>
    <!-- 头发高光 -->
    <g fill="#60b0ff">
      <rect x="56" y="16" width="8" height="4"/>
      <rect x="48" y="20" width="4" height="8"/>
      <rect x="48" y="28" width="4" height="8"/>
    </g>
    <!-- Z 发卡 -->
    <g fill="#7c3aed">
      <rect x="56" y="24" width="4" height="4"/>
      <rect x="60" y="24" width="4" height="4"/>
      <rect x="64" y="24" width="4" height="4"/>
      <rect x="60" y="28" width="4" height="4"/>
      <rect x="64" y="28" width="4" height="4"/>
      <rect x="56" y="32" width="4" height="4"/>
      <rect x="60" y="32" width="4" height="4"/>
      <rect x="64" y="32" width="4" height="4"/>
    </g>
    <!-- 脸 -->
    <g fill="#fce4d6">
      <rect x="44" y="40" width="8" height="8"/>
      <rect x="52" y="36" width="24" height="8"/>
      <rect x="76" y="40" width="8" height="8"/>
      <rect x="40" y="48" width="8" height="8"/>
      <rect x="48" y="48" width="32" height="8"/>
      <rect x="80" y="48" width="8" height="8"/>
      <rect x="40" y="56" width="8" height="8"/>
      <rect x="48" y="56" width="32" height="8"/>
      <rect x="80" y="56" width="8" height="8"/>
      <rect x="40" y="64" width="8" height="8"/>
      <rect x="48" y="64" width="32" height="8"/>
      <rect x="80" y="64" width="8" height="8"/>
      <rect x="44" y="72" width="8" height="8"/>
      <rect x="52" y="72" width="24" height="8"/>
      <rect x="76" y="72" width="8" height="8"/>
    </g>
    <!-- 眼睛 - 大 -->
    <g fill="white">
      <rect x="48" y="48" width="8" height="8"/>
      <rect x="56" y="48" width="8" height="8"/>
      <rect x="72" y="48" width="8" height="8"/>
      <rect x="64" y="48" width="8" height="8"/>
    </g>
    <g fill="#1a1a2e">
      <rect x="52" y="52" width="4" height="4"/>
      <rect x="56" y="52" width="4" height="4"/>
      <rect x="68" y="52" width="4" height="4"/>
      <rect x="72" y="52" width="4" height="4"/>
    </g>
    <!-- 眼睛高光 -->
    <g fill="white">
      <rect x="48" y="48" width="4" height="4"/>
      <rect x="64" y="48" width="4" height="4"/>
    </g>
    <!-- 腮红 -->
    <g fill="#f472b6" opacity="0.4">
      <rect x="40" y="56" width="4" height="4"/>
      <rect x="40" y="60" width="4" height="4"/>
      <rect x="84" y="56" width="4" height="4"/>
      <rect x="84" y="60" width="4" height="4"/>
    </g>
    <!-- 嘴巴 -->
    <g fill="white" opacity="0.7">
      <rect x="60" y="64" width="4" height="4"/>
      <rect x="64" y="64" width="4" height="4"/>
    </g>
    <!-- 身体/衣服 -->
    <g fill="url(#g)" opacity="0.3">
      <rect x="44" y="80" width="40" height="8"/>
      <rect x="40" y="88" width="48" height="8"/>
      <rect x="40" y="96" width="48" height="8"/>
    </g>
    <!-- 代码行围巾 -->
    <g fill="#409efc" opacity="0.5">
      <rect x="36" y="76" width="56" height="4"/>
    </g>
    <!-- 小星星 -->
    <g fill="#fbbf24">
      <rect x="96" y="28" width="4" height="4"/>
      <rect x="96" y="32" width="4" height="4"/>
      <rect x="100" y="28" width="4" height="4"/>
      <rect x="100" y="32" width="4" height="4"/>
    </g>
  </g>
</svg>