    <!-- 脸 -->
    <g fill="#fce4d6">
      <rect x="44" y="36" width="40" height="8"/>
      <rect x="40" y="44" width="8" height="8"/>
      <rect x="48" y="44" width="32" height="8"/>
      <rect x="80" y="44" width="8" height="8"/>
      <rect x="40" y="52" width="8" height="8"/>
      <rect x="48" y="52" width="32" height="8"/>
      <rect x="80" y="52" width="8" height="8"/>
      <rect x="40" y="60" width="8" height="8"/>
