      <rect x="44" y="20" width="8" height="8"/>
      <rect x="52" y="20" width="8" height="8"/>
      <rect x="60" y="20" width="8" height="8"/>
      <rect x="68" y="20" width="8" height="8"/>
      <rect x="76" y="20" width="8" height="8"/>
      <rect x="36" y="28" width="8" height="8"/>
      <rect x="44" y="28" width="8" height="8"/>
      <rect x="52" y="28" width="8" height="8"/>
      <rect x="60" y="28" width="8" height="8"/>
      <rect x="68" y="28" width="8" height="8"/>
      <rect x="76" y="28" width="8" height="8"/>
