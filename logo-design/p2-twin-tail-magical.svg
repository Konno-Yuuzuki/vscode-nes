      <rect x="28" y="36" width="8" height="8"/>
      <rect x="28" y="44" width="8" height="8"/>
      <rect x="28" y="52" width="8" height="8"/>
      <rect x="20" y="36" width="8" height="8"/>
      <rect x="20" y="44" width="8" height="8"/>
      <rect x="92" y="28" width="8" height="8"/>
      <rect x="92" y="36" width="8" height="8"/>
      <rect x="92" y="44" width="8" height="8"/>
      <rect x="92" y="52" width="8" height="8"/>
      <rect x="100" y="36" width="8" height="8"/>
      <rect x="100" y="44" width="8" height="8"/>
    </g>
    <g fill="#409efc">
