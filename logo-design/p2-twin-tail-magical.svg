    <g fill="#1a1a2e">
      <rect x="52" y="48" width="4" height="4"/>
      <rect x="56" y="48" width="4" height="4"/>
      <rect x="72" y="48" width="4" height="4"/>
      <rect x="76" y="48" width="4" height="4"/>
    </g>
    <g fill="white">
