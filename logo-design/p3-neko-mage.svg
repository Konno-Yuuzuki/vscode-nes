<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="#1a1a2e"/>
  <defs>
    <style>
      .p { shape-rendering: crispEdges; }
    </style>
  </defs>
  <g class="p">
    <!-- 帽子 - 猫耳 -->
    <g fill="#409efc">
      <rect x="44" y="12" width="8" height="8"/>
      <rect x="36" y="16" width="8" height="8"/>
      <rect x="76" y="12" width="8" height="8"/>
      <rect x="84" y="16" width="8" height="8"/>
      <rect x="40" y="20" width="48" height="8"/>
      <rect x="36" y="28" width="56" height="8"/>
    </g>
    <!-- 帽檐 Z 字 -->
    <g fill="white">
      <rect x="52" y="20" width="4" height="4"/>
      <rect x="56" y="20" width="4" height="4"/>
      <rect x="60" y="20" width="4" height="4"/>
      <rect x="56" y="24" width="4" height="4"/>
      <rect x="60" y="24" width="4" height="4"/>
      <rect x="52" y="28" width="4" height="4"/>
      <rect x="56" y="28" width="4" height="4"/>
      <rect x="60" y="28" width="4" height="4"/>
    </g>
    <!-- 脸 -->
    <g fill="#fce4d6">
      <rect x="44" y="36" width="40" height="8"/>
      <rect x="40" y="44" width="8" height="8"/>
      <rect x="48" y="44" width="32" height="8"/>
      <rect x="80" y="44" width="8" height="8"/>
      <rect x="40" y="52" width="8" height="8"/>
      <rect x="48" y="52" width="32" height="8"/>
      <rect x="80" y="52" width="8" height="8"/>
      <rect x="40" y="60" width="8" height="8"/>
      <rect x="48" y="60" width="32" height="8"/>
      <rect x="80" y="60" width="8" height="8"/>
      <rect x="44" y="68" width="8" height="8"/>
      <rect x="52" y="68" width="24" height="8"/>
      <rect x="76" y="68" width="8" height="8"/>
    </g>
    <!-- 眼睛 大 -->
    <g fill="white">
      <rect x="48" y="44" width="12" height="12"/>
      <rect x="68" y="44" width="12" height="12"/>
    </g>
    <g fill="#1a1a2e">
      <rect x="52" y="48" width="4" height="8"/>
      <rect x="56" y="48" width="4" height="8"/>
      <rect x="72" y="48" width="4" height="8"/>
      <rect x="76" y="48" width="4" height="8"/>
    </g>
    <g fill="white">
      <rect x="48" y="44" width="4" height="4"/>
      <rect x="68" y="44" width="4" height="4"/>
    </g>
    <!-- 嘴巴 - 猫嘴 -->
    <g fill="#1a1a2e" opacity="0.3">
      <rect x="60" y="60" width="4" height="4"/>
      <rect x="64" y="60" width="4" height="4"/>
    </g>
    <!-- 胡须 -->
    <g fill="white" opacity="0.3">
      <rect x="28" y="52" width="12" height="4"/>
      <rect x="28" y="60" width="12" height="4"/>
      <rect x="88" y="52" width="12" height="4"/>
      <rect x="88" y="60" width="12" height="4"/>
    </g>
    <!-- 身体 -->
    <g fill="#7c3aed" opacity="0.3">
      <rect x="44" y="76" width="40" height="8"/>
      <rect x="40" y="84" width="48" height="8"/>
      <rect x="40" y="92" width="48" height="8"/>
    </g>
    <!-- 代码行围巾 -->
    <g fill="#409efc" opacity="0.5">
      <rect x="36" y="72" width="56" height="4"/>
    </g>
    <!-- 小星星 -->
    <g fill="#fbbf24">
      <rect x="100" y="24" width="4" height="4"/>
      <rect x="104" y="28" width="4" height="4"/>
      <rect x="100" y="32" width="4" height="4"/>
      <rect x="96" y="28" width="4" height="4"/>
    </g>
  </g>
</svg>